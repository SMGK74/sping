name: PSScriptAnalyzer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

          # PSAvoidUsingWriteHost esclusa: Sping.ps1 usa Write-Host di proposito per la dashboard colorata
          # in console (non e' un modulo riutilizzabile), quindi la regola genererebbe solo rumore.
          $results = Invoke-ScriptAnalyzer -Path ./Sping.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost

          if ($results) {
            $results | Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          } else {
            Write-Host "Nessun problema rilevato."
          }

          $errorCount = @($results | Where-Object { $_.Severity -eq 'Error' }).Count
          $warningCount = @($results | Where-Object { $_.Severity -eq 'Warning' }).Count
          Write-Host "`nRiepilogo: $errorCount errori, $warningCount avvisi."

          if ($errorCount -gt 0) {
            Write-Host "::error::PSScriptAnalyzer ha trovato $errorCount errore/i bloccante/i."
            exit 1
          }
